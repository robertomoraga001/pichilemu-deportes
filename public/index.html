<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Jugadores - Pichilemu Deportes</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                
                <!-- SECCIÓN 1: Ingreso por Clave de Club -->
                <div id="seccion-login" class="card shadow p-4">
                    <h3 class="text-center mb-3">Acceso Clubes de Pichilemu</h3>
                    <p class="text-muted text-center">Ingrese la clave de su club para habilitar el formulario de inscripción.</p>
                    <div class="mb-3">
                        <label for="input-clave" class="form-label">Clave de Acceso del Club</label>
                        <input type="password" class="form-control" id="input-clave" placeholder="Ingrese clave...">
                    </div>
                    <button type="button" class="btn btn-primary w-100" onclick="validarClave()">Ingresar</button>
                    <div id="error-clave" class="text-danger text-center mt-2" style="display: none;">Clave incorrecta. Intente nuevamente.</div>
                </div>

                <!-- SECCIÓN 2: Formulario de Registro (Oculto hasta poner la clave correcta) -->
                <div id="seccion-formulario" class="card shadow p-4" style="display: none;">
                    <h3 class="text-center mb-3 text-primary" id="titulo-club">Registro de Jugador</h3>
                    
                    <form id="form-jugador" enctype="multipart/form-data">
                        
                        <!-- Club Deportivo (Bloqueado o preseleccionado según la clave) -->
                        <div class="mb-3">
                            <label for="club_deportivo" class="form-label">Club Deportivo</label>
                            <select class="form-select" id="club_deportivo" required>
                                <option value="" disabled selected>Selecciona tu club...</option>
                                <option value="Agustín Ross Edwards">Agustín Ross Edwards</option>
                                <option value="Arturo Prat">Arturo Prat</option>
                                <option value="Cardenal Caro">Cardenal Caro</option>
                                <option value="El Ciclón de la Costa">El Ciclón de la Costa (Club Deportivo y Social)</option>
                                <option value="Estrella Olímpica">Estrella Olímpica</option>
                                <option value="Independiente Pichilemu (CDI)">Independiente Pichilemu (CDI)</option>
                                <option value="Infiernillo">Infiernillo</option>
                                <option value="Marítimos Unidos">Marítimos Unidos</option>
                                <option value="Unión Cáhuil">Unión Cáhuil</option>
                                <option value="Unión Pichilemu">Unión Pichilemu</option>
                                <option value="Unión Victoria">Unión Victoria</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="nombre_completo" class="form-label">Nombre Completo</label>
                            <input type="text" class="form-control" id="nombre_completo" required>
                        </div>

                        <div class="mb-3">
                            <label for="rut" class="form-label">RUT / Identificación</label>
                            <input type="text" class="form-control" id="rut" placeholder="Ej. 12.345.678-9" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="ano_nacimiento" class="form-label">Año de Nacimiento</label>
                                <input type="number" class="form-control" id="ano_nacimiento" placeholder="Ej. 1995" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="peso" class="form-label">Peso (kg)</label>
                                <input type="number" step="0.1" class="form-control" id="peso" placeholder="Ej. 75.5" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="estatura" class="form-label">Estatura (cm o m)</label>
                                <input type="number" step="0.01" class="form-control" id="estatura" placeholder="Ej. 1.78" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="dorsal" class="form-label">Número / Dorsal</label>
                                <input type="number" class="form-control" id="dorsal" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="posicion" class="form-label">Posición</label>
                            <input type="text" class="form-control" id="posicion" placeholder="Ej. Delantero, Defensa..." required>
                        </div>

                        <!-- Subir Fotografía -->
                        <div class="mb-3">
                            <label for="foto" class="form-label">Fotografía del Jugador (Para gráficas TV)</label>
                            <input type="file" class="form-control" id="foto" accept="image/*" required>
                        </div>

                        <input type="hidden" id="deporte" value="Fútbol">

                        <button type="submit" class="btn btn-success w-100">Guardar Ficha del Jugador</button>
                    </form>
                    
                    <div id="mensaje-exito" class="alert alert-success mt-3" style="display: none;"></div>
                </div>

            </div>
        </div>
    </div>

    <!-- Script de validación de claves y envío -->
    <script>
        // Diccionario de claves por club (puedes cambiarlas cuando gustes)
        const clavesClubes = {
            "0203": "Unión Victoria",
            "1926": "Unión Pichilemu",
            "1111": "Agustín Ross Edwards",
            "2222": "Arturo Prat",
            "3333": "Cardenal Caro",
            "4444": "El Ciclón de la Costa",
            "5555": "Estrella Olímpica",
            "6666": "Independiente Pichilemu (CDI)",
            "7777": "Infiernillo",
            "8888": "Marítimos Unidos",
            "9999": "Unión Cáhuil"
        };

        function validarClave() {
            const claveIngresada = document.getElementById('input-clave').value.trim();
            const clubAsignado = clavesClubes[claveIngresada];

            if (clubAsignado) {
                // Ocultar login y mostrar formulario
                document.getElementById('seccion-login').style.display = 'none';
                document.getElementById('seccion-formulario').style.display = 'block';
                
                // Preseleccionar el club y bloquear el selector para que corresponda a la clave
                const selectClub = document.getElementById('club_deportivo');
                selectClub.value = clubAsignado;
                selectClub.disabled = true; // El jugador inscribe directo en su club autorizado
                
                document.getElementById('titulo-club').innerText = `Registro - Club ${clubAsignado}`;
            } else {
                document.getElementById('error-clave').style.display = 'block';
            }
        }

        // Enviar formulario al servidor
        document.getElementById('form-jugador').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData();
            formData.append('nombre_completo', document.getElementById('nombre_completo').value);
            formData.append('rut', document.getElementById('rut').value);
            formData.append('ano_nacimiento', document.getElementById('ano_nacimiento').value);
            formData.append('peso', document.getElementById('peso').value);
            formData.append('estatura', document.getElementById('estatura').value);
            formData.append('dorsal', document.getElementById('dorsal').value);
            formData.append('posicion', document.getElementById('posicion').value);
            formData.append('deporte', document.getElementById('deporte').value);
            formData.append('club_deportivo', document.getElementById('club_deportivo').value); // Se envía aunque esté disabled
            
            const archivoFoto = document.getElementById('foto').files[0];
            if (archivoFoto) {
                formData.append('foto', archivoFoto);
            }

            try {
                const response = await fetch('/api/jugadores', {
                    method: 'POST',
                    body: formData
                });

                const resultado = await response.json();
                if (response.ok) {
                    const alerta = document.getElementById('mensaje-exito');
                    alerta.style.display = 'block';
                    alerta.innerText = '¡Ficha y fotografía guardadas con éxito!';
                    document.getElementById('form-jugador').reset();
                } else {
                    alert('Error: ' + resultado.error);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Hubo un problema al conectar con el servidor.');
            }
        });
    </script>
</body>
</html>
